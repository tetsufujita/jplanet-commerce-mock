    <circle cx="0" cy="95" r="17" fill="#1f2e4f"/>
    <circle cx="280" cy="95" r="17" fill="#1f2e4f"/>
    <text x="140" y="48" text-anchor="middle" fill="#1f3864" font-family="Arial, sans-serif" font-size="18" font-weight="700">配送料クーポン</text>
    <text x="140" y="111" text-anchor="middle" fill="#1f2e4f" font-family="Arial, sans-serif" font-size="50" font-weight="800">50% OFF</text>
