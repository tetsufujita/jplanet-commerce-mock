<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andes Frame A v2</title>
    <style>
      :root {
        --navy: #0f1b3d;
        --paper: #fafaf7;
        --ink: #0a0a0a;
        --crimson: #c8102e;
        --glow: #e83e5c;
        --deep: #060b1f;
        --muted: #9ea6ba;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; background: #101010; }
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: Inter, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
      }

      .frame {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        color: var(--paper);
        background:
          radial-gradient(circle at 70% 44%, rgba(200, 16, 46, 0.16), transparent 18%),
          radial-gradient(circle at 76% 48%, rgba(250, 250, 247, 0.09), transparent 34%),
          linear-gradient(105deg, #081128 0%, #0f1b3d 48%, #061020 100%);
      }

      .frame::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        background-image:
          linear-gradient(rgba(250, 250, 247, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(250, 250, 247, 0.045) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(circle at 68% 48%, black 0 48%, transparent 78%);
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        opacity: 0.12;
        mix-blend-mode: overlay;
        background-image:
          repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 5px),
          repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 7px);
      }

      .copy {
        position: absolute;
        left: 118px;
        top: 164px;
        z-index: 12;
        width: 805px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        color: rgba(250, 250, 247, 0.66);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--crimson);
        box-shadow: 0 0 28px rgba(232, 62, 92, 0.72);
      }

      h1 {
        margin: 0;
        font-size: 116px;
        font-weight: 820;
        letter-spacing: -0.065em;
        line-height: 0.96;
      }

      .lede {
        width: 660px;
        margin-top: 34px;
        color: rgba(250, 250, 247, 0.72);
        font-size: 24px;
        font-weight: 560;
        line-height: 1.48;
        letter-spacing: -0.025em;
      }

      .system-note {
        position: absolute;
        left: 122px;
        bottom: 90px;
        z-index: 12;
        width: 660px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .system-note span {
        border: 1px solid rgba(250, 250, 247, 0.13);
        border-radius: 999px;
        padding: 14px 16px;
        color: rgba(250, 250, 247, 0.64);
        font-size: 12px;
        font-weight: 780;
        letter-spacing: 0.12em;
        text-align: center;
        text-transform: uppercase;
        background: rgba(250, 250, 247, 0.04);
      }

      svg {
        position: absolute;
        inset: 0;
        z-index: 4;
      }

      .sphere {
        fill: rgba(250, 250, 247, 0.018);
        stroke: rgba(250, 250, 247, 0.09);
      }

      .land {
        fill: rgba(250, 250, 247, 0.045);
        stroke: rgba(250, 250, 247, 0.05);
        stroke-width: 0.6;
      }

      .country-focus {
        fill: rgba(250, 250, 247, 0.1);
        stroke: rgba(250, 250, 247, 0.2);
        stroke-width: 0.8;
      }

      .corridor {
        fill: none;
        stroke-linecap: round;
      }

      .corridor-core {
        stroke: url(#route);
        stroke-width: 3.5;
        filter: drop-shadow(0 0 28px rgba(200, 16, 46, 0.42));
      }

      .corridor-ghost {
        stroke: rgba(250, 250, 247, 0.13);
        stroke-width: 1.5;
      }

      .corridor-band {
        fill: none;
        stroke: rgba(200, 16, 46, 0.1);
        stroke-width: 60;
        stroke-linecap: round;
        filter: blur(6px);
      }

      .particle-field {
        fill: var(--paper);
      }

      .fragment path {
        fill: rgba(250, 250, 247, 0.075);
        stroke: rgba(250, 250, 247, 0.16);
        stroke-width: 1;
      }

      .fragment text {
        font-family: "SF Mono", "JetBrains Mono", "Roboto Mono", monospace;
      }

      .fragment-label {
        fill: rgba(250, 250, 247, 0.86);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.7px;
      }

      .fragment-body {
        fill: rgba(250, 250, 247, 0.54);
        font-size: 11px;
        letter-spacing: 0.3px;
      }

      .anchor path {
        fill: var(--crimson);
        filter: drop-shadow(0 0 16px rgba(232, 62, 92, 0.8));
      }

      .anchor text {
        fill: rgba(250, 250, 247, 0.86);
        font-size: 14px;
        font-weight: 840;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }

      .anchor .anchor-sub {
        fill: rgba(250, 250, 247, 0.42);
        font-size: 11px;
        font-weight: 720;
      }

      .platform-ghost {
        position: absolute;
        right: 88px;
        bottom: 86px;
        z-index: 6;
        width: 640px;
        height: 150px;
        border-radius: 34px;
        border: 1px solid rgba(250, 250, 247, 0.12);
        background:
          linear-gradient(90deg, rgba(200, 16, 46, 0.16), transparent 32%),
          rgba(250, 250, 247, 0.04);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.12);
      }

      .platform-ghost::before {
        content: "ANDES PLATFORM";
        position: absolute;
        left: 26px;
        top: 22px;
        color: rgba(250, 250, 247, 0.5);
        font-size: 12px;
        font-weight: 820;
        letter-spacing: 0.16em;
      }

      .platform-ghost::after {
        content: "tax / customs / logistics / payments / agent rails";
        position: absolute;
        left: 26px;
        bottom: 22px;
        color: rgba(250, 250, 247, 0.76);
        font-size: 24px;
        font-weight: 720;
        letter-spacing: -0.03em;
      }
    </style>
  </head>

      <div class="copy">
        <div class="eyebrow">The corridor becomes infrastructure</div>
