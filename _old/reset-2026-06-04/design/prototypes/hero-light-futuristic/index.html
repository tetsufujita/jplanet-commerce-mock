<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Andes — Hero prototype (light futuristic)</title>
<style>
  :root{ --bg:#F7F6F2; --ink:#14213A; --muted:#6B7180; --crimson:#C8102E; --line:rgba(20,33,58,.10); }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}
  #runway{height:280vh;}
  #stage{position:fixed;inset:0;overflow:hidden;background:var(--bg);}
  /* blueprint dot-grid (neutral, no added color) */
  #stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(20,33,58,.05) 1px, transparent 1px);
    background-size:24px 24px;}
  /* faint single-color (Crimson) warmth near globe — restrained, no rainbow */
  #stage::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(58% 58% at 70% 46%, rgba(200,16,46,.06), transparent 72%);}
  #stars{display:none;}
  #globeBox{position:absolute;z-index:1;}
  #cobe,#ovl{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #ovl{z-index:2;pointer-events:none;}
  .copy{position:absolute;z-index:4;left:7vw;top:50%;transform:translateY(-54%);max-width:32ch;}
  .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--muted);display:flex;align-items:center;gap:10px;}
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--crimson);box-shadow:0 0 8px rgba(200,16,46,.5);}
  h1{font-size:clamp(38px,5vw,62px);line-height:1.08;letter-spacing:-0.022em;font-weight:380;margin-top:20px;color:var(--ink);}
  h1 .line{display:block;overflow:hidden;}
  h1 .line > span{display:block;transform:translateY(110%);animation:rise .95s cubic-bezier(.16,1,.3,1) forwards;}
  h1 .line:nth-child(2) > span{animation-delay:.1s;}
  @keyframes rise{to{transform:translateY(0);}}
  .sub{margin-top:20px;font-size:clamp(14px,1.5vw,17px);color:var(--muted);line-height:1.6;max-width:30ch;}
  .stat{margin-top:18px;font-size:12.5px;color:var(--muted);letter-spacing:.02em;display:flex;align-items:baseline;gap:8px;}
  .stat b{color:var(--ink);font-weight:600;}
  .stat .n{color:var(--crimson);font-weight:700;font-variant-numeric:tabular-nums;}
  .cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;}
  .btn{font-size:14px;font-weight:600;padding:12px 20px;border-radius:5px;border:1px solid transparent;cursor:pointer;letter-spacing:.01em;}
  .btn.solid{background:var(--crimson);color:#fff;}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  #coord{position:absolute;z-index:2;font-size:11px;letter-spacing:.06em;color:rgba(20,33,58,.78);white-space:nowrap;opacity:0;pointer-events:none;}
  #coord .tick{color:var(--crimson);}
  #coord small{display:block;font-size:9px;letter-spacing:.16em;color:var(--muted);margin-top:3px;}
  #hint{position:absolute;z-index:4;left:50%;bottom:24px;transform:translateX(-50%);font-size:10px;letter-spacing:.3em;color:var(--muted);opacity:.7;}
  #hint::after{content:"";display:block;width:1px;height:24px;margin:9px auto 0;background:linear-gradient(var(--muted),transparent);}
  @media (max-width:760px){
    .copy{left:0;right:0;top:auto;bottom:9vh;transform:none;max-width:none;padding:0 24px;}
    h1{font-size:31px;}
  }
  @media (prefers-reduced-motion:reduce){ h1 .line > span{animation:none;transform:none;} }
</style>
</head>
<body>
<div id="stage">
  <div id="globeBox"><canvas id="cobe"></canvas><canvas id="ovl"></canvas>
    <div id="coord" class="mono">-23.56, -46.65<small>SÃO PAULO · AV. PAULISTA</small></div>
  </div>
  <div class="copy">
    <div class="eyebrow"><span class="dot"></span><span class="mono">TOKYO &nbsp;⇄&nbsp; SÃO PAULO</span></div>
    <h1><span class="line"><span>中南米に、新しい</span></span><span class="line"><span>経済の基盤を建てる。</span></span></h1>
    <p class="sub">グローバル AI と、ブラジルの現場をつなぐ。</p>
    <p class="stat mono"><b>LATAM EC 市場</b><span class="n" id="statN">US$0億</span><span>［PCMI］</span></p>
    <div class="cta">
      <button class="btn solid">資料請求</button>
      <button class="btn ghost">事業を見る</button>
    </div>
  </div>
  <div id="hint" class="mono">SCROLL</div>
</div>
<div id="runway"></div>

<script src="./cobe-global.js"></script>
<script>
const TAU=Math.PI*2, D2R=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};

const params=new URLSearchParams(location.search);
const forcedP=params.has('p')?clamp(parseFloat(params.get('p')),0,1):null;

const box=document.getElementById('globeBox');
const cobeC=document.getElementById('cobe');
const ovl=document.getElementById('ovl'), octx=ovl.getContext('2d');
const coord=document.getElementById('coord'), hint=document.getElementById('hint'), statN=document.getElementById('statN');
if(forcedP!==null) hint.style.display='none';

const SP=[-23.56,-46.65], TK=[35.68,139.69];
const phiTK=-Math.PI/2 - TK[1]*D2R, phiSP=-Math.PI/2 - SP[1]*D2R;
const thetaA=-0.10, thetaB=0.26;

function U([lat,lng]){const r=lat*D2R,a=lng*D2R-Math.PI,o=Math.cos(r);return[-o*Math.cos(a),Math.sin(r),o*Math.sin(a)];}
function project(loc,f,l){
  const v=U(loc),r=0.85,t0=v[0]*r,t1=v[1]*r,t2=v[2]*r;
  const rr=Math.cos(l),a=Math.cos(f),o=Math.sin(l),i=Math.sin(f);
  const c=a*t0+i*t2,s=i*o*t0+rr*t1-a*o*t2;
  return {x:(c+1)/2,y:(-s+1)/2,front:(-i*rr*t0+o*t1+a*rr*t2)};
}
const CITY=[];(function(){let s=42;const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  for(let i=0;i<36;i++) CITY.push({loc:[SP[0]+(rnd()-0.5)*7.5,SP[1]+(rnd()-0.5)*9],b:0.4+rnd()*0.6});})();

let W,H,DPR,G,globe;
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  const mobile=W<760;
  G=mobile?Math.min(W*0.96,H*0.52):Math.min(H*0.94,W*0.54);
  const left=mobile?(W-G)/2:(W-G-W*0.04), top=mobile?H*0.075:(H-G)/2;
  box.style.left=left+'px'; box.style.top=top+'px'; box.style.width=G+'px'; box.style.height=G+'px';
  ovl.width=G*DPR; ovl.height=G*DPR; octx.setTransform(DPR,0,0,DPR,0,0);
  if(globe){globe.destroy();globe=null;}
  globe=createGlobe(cobeC,{
    devicePixelRatio:DPR,width:G,height:G,phi:phiTK,theta:thetaA,
    dark:0, diffuse:1.0, mapSamples:16000, mapBrightness:1.05, mapBaseBrightness:0.12,
    baseColor:[0.80,0.81,0.85], glowColor:[0.97,0.97,0.99], markerColor:[0.78,0.06,0.18],
    opacity:1, scale:1, offset:[0,0],
    markers:[{location:TK,size:0.05},{location:SP,size:0.05}],
  });
}

// stat count-up (Stripe 流の futuristic 数字)
let statStart=null;
function statTick(ts){
  if(statStart===null) statStart=ts;
  const t=clamp((ts-statStart)/1200,0,1), val=Math.round(7690*(t*t*(3-2*t)));
  statN.textContent='US$'+val.toLocaleString('en-US')+'億';
  if(t<1) requestAnimationFrame(statTick);
}
requestAnimationFrame(statTick);

function frame(){
  let p=forcedP!==null?forcedP:clamp(window.scrollY/Math.max(1,document.getElementById('runway').offsetHeight-H),0,1);
  const f=lerp(phiTK,phiSP,p), l=lerp(thetaA,thetaB,p);
  const spB=smooth(0.34,0.92,p), reveal=smooth(0.42,0.82,p);
  const bloom=Math.exp(-Math.pow((p-0.80)/0.05,2)); // 灯る一瞬

  if(globe) globe.update({phi:f,theta:l,markers:[{location:TK,size:0.05},{location:SP,size:0.045+spB*0.05}]});

  octx.clearRect(0,0,G,G);
  const sp=project(SP,f,l);
  if(sp.front>=-0.02 && spB>0.02){
    const sx=sp.x*G, sy=sp.y*G;
    // glow (source-over, 明背景に負けないコントラスト)
    const gr=G*(0.045+spB*0.05+bloom*0.02);
    const g=octx.createRadialGradient(sx,sy,0,sx,sy,gr);
    g.addColorStop(0,`rgba(200,16,46,${0.42*spB+0.18*bloom})`);
    g.addColorStop(0.45,`rgba(200,16,46,${0.14*spB})`);
    g.addColorStop(1,'rgba(200,16,46,0)');
    octx.fillStyle=g; octx.beginPath(); octx.arc(sx,sy,gr,0,TAU); octx.fill();
    // bloom ring（灯る瞬間）
    if(bloom>0.04){ octx.strokeStyle=`rgba(200,16,46,${0.5*bloom})`; octx.lineWidth=1.2;
      octx.beginPath(); octx.arc(sx,sy,gr*(0.7+0.5*(1-bloom)),0,TAU); octx.stroke(); }
    // city cluster
    for(const c of CITY){const q=project(c.loc,f,l); if(q.front<0) continue;
      const al=spB*c.b*0.55, qx=q.x*G, qy=q.y*G;
      octx.fillStyle=c.b>0.78?`rgba(200,16,46,${al})`:`rgba(20,33,58,${al*0.5})`;
      octx.fillRect(qx-0.7,qy-0.7,1.4,1.4);}
    // Av. Paulista hairline
    const len=G*0.085, ang=-0.62;
    octx.strokeStyle=`rgba(200,16,46,${reveal*0.55})`; octx.lineWidth=1.1;
    octx.beginPath(); octx.moveTo(sx-Math.cos(ang)*len,sy-Math.sin(ang)*len); octx.lineTo(sx+Math.cos(ang)*len,sy+Math.sin(ang)*len); octx.stroke();
    // core dot
    octx.fillStyle='rgba(180,12,40,0.95)'; octx.beginPath(); octx.arc(sx,sy,2.0+1.2*spB,0,TAU); octx.fill();
    coord.style.opacity=reveal*0.95; coord.style.left=(sx+G*0.03)+'px'; coord.style.top=(sy+G*0.05)+'px';
  } else { coord.style.opacity=0; }
  requestAnimationFrame(frame);
}

window.addEventListener('resize',layout,{passive:true});
layout(); requestAnimationFrame(frame);
</script>
</body>
</html>
