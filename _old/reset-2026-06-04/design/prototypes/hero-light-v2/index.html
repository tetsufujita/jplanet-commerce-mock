<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Andes — Hero light v2 (commerce rail / infrastructure)</title>
<style>
  :root{ --bg:#F7F6F2; --ink:#14213A; --muted:#6B7180; --crimson:#C8102E; --line:rgba(20,33,58,.10); }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}
  #runway{height:260vh;}
  #stage{position:fixed;inset:0;overflow:hidden;background:var(--bg);}
  #stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(20,33,58,.045) 1px, transparent 1px);background-size:26px 26px;}
  #scene{position:absolute;inset:0;z-index:1;width:100%;height:100%;display:block;}
  .copy{position:absolute;z-index:3;left:7vw;top:50%;transform:translateY(-52%);}
  .kick{width:26px;height:2px;background:var(--crimson);margin-bottom:18px;border-radius:2px;}
  .eyebrow{font-size:11.5px;letter-spacing:.2em;color:var(--muted);}
  h1{font-size:clamp(38px,4.4vw,56px);line-height:1.14;letter-spacing:-0.02em;font-weight:400;margin-top:16px;color:var(--ink);}
  h1 .l{display:block;overflow:hidden;white-space:nowrap;}
  h1 .l > span{display:block;transform:translateY(108%);animation:rise 1s cubic-bezier(.16,1,.3,1) forwards;}
  h1 .l:nth-child(2) > span{animation-delay:.07s;}
  h1 .l:nth-child(3) > span{animation-delay:.14s;}
  h1 b{font-weight:580;}
  @keyframes rise{to{transform:translateY(0);}}
  .sub{margin-top:22px;font-size:clamp(14px,1.4vw,16.5px);color:var(--muted);line-height:1.65;max-width:30ch;}
  .stat{margin-top:22px;display:flex;align-items:baseline;gap:10px;font-size:12.5px;color:var(--muted);letter-spacing:.02em;}
  .stat .lab{font-weight:600;color:var(--ink);}
  .stat .n{color:var(--crimson);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;}
  .stat .src{font-size:10.5px;}
  .cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;}
  .btn{font-size:14px;font-weight:600;padding:12px 22px;border-radius:6px;border:1px solid transparent;cursor:pointer;}
  .btn.solid{background:var(--crimson);color:#fff;}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line);}
  #hint{position:absolute;z-index:3;left:50%;bottom:22px;transform:translateX(-50%);font-size:10px;letter-spacing:.3em;color:var(--muted);opacity:.6;}
  @media (max-width:760px){
    .copy{left:0;right:0;top:auto;bottom:7vh;transform:none;padding:0 24px;}
    h1{font-size:32px;}
  }
  @media (prefers-reduced-motion:reduce){ h1 .l > span{animation:none;transform:none;} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <div class="copy">
    <div class="kick"></div>
    <div class="eyebrow mono">ANDES — AGENTIC COMMERCE INFRASTRUCTURE</div>
    <h1><span class="l"><span>中南米に、</span></span><span class="l"><span>新しい経済の</span></span><span class="l"><span><b>基盤</b>を建てる。</span></span></h1>
    <p class="sub">日本と中南米を、AI エージェントの商取引でつなぐ。物流・税務・法務までを、一つの基盤に。</p>
    <p class="stat"><span class="lab">LATAM の EC 市場</span><span class="n" id="statN">US$0億</span><span class="src mono">［PCMI］</span></p>
    <div class="cta"><button class="btn solid">資料請求</button><button class="btn ghost">事業を見る</button></div>
  </div>
  <div id="hint" class="mono">SCROLL</div>
</div>
<div id="runway"></div>

<script>
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const params=new URLSearchParams(location.search);
const forced=params.has('p')?clamp(parseFloat(params.get('p')),0,1):null;

const cv=document.getElementById('scene'), ctx=cv.getContext('2d');
const statN=document.getElementById('statN'), hint=document.getElementById('hint');
if(forced!==null) hint.style.display='none';

let W,H,DPR,mobile,S;
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; mobile=W<760;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  const railY = mobile? H*0.34 : H*0.50;
  const PX0 = mobile? W*0.10 : W*0.50;
  const PX1 = mobile? W*0.90 : W*0.92;
  S={railY,PX0,PX1, x0:PX0+(mobile?6:14), x1:PX1-(mobile?14:30)};
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const t0=performance.now();
function statTick(ts){const t=clamp((ts-t0)/1300,0,1),v=Math.round(7690*smooth(0,1,t));
  statN.textContent='US$'+v.toLocaleString('en-US')+'億'; if(t<1)requestAnimationFrame(statTick);}
requestAnimationFrame(statTick);

function frame(ts){
  const t=(ts-t0)/1000;
  let p = forced!==null ? forced : clamp(scrollY/Math.max(1,document.getElementById('runway').offsetHeight-H),0,1);
  const L = forced!==null ? 1 : smooth(0,1.4,t);
  const {railY,PX0,PX1,x0,x1}=S;
  ctx.clearRect(0,0,W,H);

  // --- background globe whisper (demoted, faint) ---
  (function(){
    const gx=mobile?W*0.5:W*0.72, gy=mobile?H*0.17:H*0.36, gr=mobile?W*0.30:H*0.40;
    ctx.save(); ctx.globalAlpha=0.9;
    ctx.strokeStyle='rgba(20,33,58,.06)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(gx,gy,gr,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba(20,33,58,.05)';
    for(let i=0;i<150;i++){const a=i*2.399963, r2=Math.sqrt(i/150)*gr; ctx.fillRect(gx+Math.cos(a)*r2, gy+Math.sin(a)*r2*0.6,1,1);}
    ctx.strokeStyle='rgba(200,16,46,.12)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(gx-gr*0.55,gy-gr*0.05); ctx.quadraticCurveTo(gx,gy-gr*0.8,gx+gr*0.55,gy+gr*0.2); ctx.stroke();
    ctx.restore();
  })();

  // --- perspective rails (scale / future) ---
  for(let i=1;i<=3;i++){const yy=railY-i*(mobile?14:18), fade=0.06*(1-i/4);
    ctx.strokeStyle=`rgba(20,33,58,${fade})`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(lerp(PX0,x0,i/3.5), yy); ctx.lineTo(PX1-i*(mobile?8:14), yy); ctx.stroke();}

  // --- infrastructure layers (white slabs rising, with soft shadow) ---
  const slabN=4, sh=mobile?11:14, gap=mobile?15:19, w=PX1-PX0;
  ctx.save();
  for(let i=0;i<slabN;i++){
    const li=smooth(i*0.12,i*0.12+0.55,L), yT=railY+14+i*(sh+gap), y=yT+(1-li)*40;
    ctx.globalAlpha=li;
    ctx.shadowColor='rgba(20,33,58,.16)'; ctx.shadowBlur=18; ctx.shadowOffsetY=9;
    ctx.fillStyle='#FFFFFF'; rr(PX0,y,w,sh,4); ctx.fill();
    ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.strokeStyle='rgba(20,33,58,.10)'; ctx.lineWidth=1; rr(PX0,y,w,sh,4); ctx.stroke();
    if(i===0){ctx.fillStyle='rgba(200,16,46,.7)'; rr(PX0,y,3,sh,1.5); ctx.fill();}
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // --- commerce rail (Tokyo → São Paulo) ---
  const railL=smooth(0.45,1.0,L);
  ctx.strokeStyle='rgba(20,33,58,.30)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x0,railY); ctx.lineTo(lerp(x0,x1,railL),railY); ctx.stroke();
  // pulse
  const pf = forced!==null ? lerp(0.10,0.97,p) : ((t*0.4)%1);
  if(railL>0.98){
    const px=lerp(x0,x1,pf);
    const grad=ctx.createLinearGradient(px-52,0,px,0);
    grad.addColorStop(0,'rgba(200,16,46,0)'); grad.addColorStop(1,'rgba(200,16,46,.85)');
    ctx.strokeStyle=grad; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(Math.max(x0,px-52),railY); ctx.lineTo(px,railY); ctx.stroke();
    ctx.fillStyle='rgba(200,16,46,1)'; ctx.beginPath(); ctx.arc(px,railY,2.6,0,TAU); ctx.fill();
  }

  // --- Tokyo node ---
  ctx.fillStyle='rgba(20,33,58,.85)'; ctx.beginPath(); ctx.arc(x0,railY,3.2,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(20,33,58,.5)'; ctx.font='10px ui-monospace,monospace'; ctx.textAlign='left';
  ctx.fillText('TOKYO', x0+8, railY+4);

  // --- São Paulo: city grid (rising) + Crimson pin + glow + labels ---
  const arrive = forced!==null ? smooth(0.5,0.95,p) : (0.55+0.45*clamp(1-Math.abs(pf-0.97)/0.12,0,1));
  const spB = clamp(0.5+0.5*arrive,0,1);
  const gr2=mobile?34:46;
  const g2=ctx.createRadialGradient(x1,railY,0,x1,railY,gr2);
  g2.addColorStop(0,`rgba(200,16,46,${0.26*spB})`); g2.addColorStop(0.5,`rgba(200,16,46,${0.07*spB})`); g2.addColorStop(1,'rgba(200,16,46,0)');
  ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(x1,railY,gr2,0,TAU); ctx.fill();
  const bars=9, bw=mobile?3:4.4, bgap=mobile?2.8:3.4, hs=[18,34,52,72,90,64,44,28,16];
  const totalW=bars*bw+(bars-1)*bgap, bx0=x1-totalW*0.62;
  ctx.save();
  for(let j=0;j<bars;j++){
    const bt=smooth(0.55+j*0.045,1.05+j*0.045,L), bh=hs[j]*bt*(mobile?0.62:1), bx=bx0+j*(bw+bgap);
    ctx.shadowColor='rgba(20,33,58,.12)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(bx,railY-bh,bw,bh);
    ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.strokeStyle='rgba(20,33,58,.10)'; ctx.lineWidth=0.8; ctx.strokeRect(bx,railY-bh,bw,bh);
    if(j===4){ ctx.fillStyle=`rgba(200,16,46,${0.7+0.3*spB})`; ctx.fillRect(bx,railY-bh,bw,5);
      ctx.fillStyle=`rgba(200,16,46,${spB})`; ctx.beginPath(); ctx.arc(bx+bw/2,railY-bh-6,2.4+1.4*arrive,0,TAU); ctx.fill(); }
  }
  ctx.restore();
  ctx.fillStyle='rgba(200,16,46,1)'; ctx.beginPath(); ctx.arc(x1,railY,3,0,TAU); ctx.fill();
  ctx.textAlign='left';
  ctx.fillStyle='rgba(200,16,46,.9)'; ctx.font='10px ui-monospace,monospace'; ctx.fillText('SÃO PAULO', x1+8, railY+4);
  ctx.fillStyle='rgba(20,33,58,.42)'; ctx.font='9px ui-monospace,monospace'; ctx.fillText('-23.56, -46.65', x1+8, railY+16);

  requestAnimationFrame(frame);
}
addEventListener('resize',layout,{passive:true});
layout(); requestAnimationFrame(frame);
</script>
</body>
</html>
